# CAS A — Nginx déjà présent sur l'hôte : AJOUTER ce fichier (nouveau), ne rien écraser.
# /etc/nginx/conf.d/simulation.guedou.ch.conf
server {
    listen 80;
    listen [::]:80;
    server_name simulation.guedou.ch;
    root /var/www/simulation;
    index index.html;
    location = /ligth { return 301 /light/; }
    location = /light { return 301 /light/; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff;
}
# Puis :  sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d simulation.guedou.ch   (ajoute HTTPS à CE bloc uniquement)
