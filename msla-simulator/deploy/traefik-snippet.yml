# CAS C — Traefik + Docker : ajouter un NOUVEAU conteneur nginx statique, sans toucher à n8n.
# À adapter selon l'audit : nom du réseau Traefik, entrypoints, certresolver.
services:
  simulation:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - /var/www/simulation:/usr/share/nginx/html:ro
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.simulation.rule=Host(`simulation.guedou.ch`)
      - traefik.http.routers.simulation.entrypoints=websecure
      - traefik.http.routers.simulation.tls.certresolver=letsencrypt
      - traefik.http.routers.simulation-redir.rule=Host(`simulation.guedou.ch`) && (Path(`/light`) || Path(`/ligth`))
      - traefik.http.routers.simulation-redir.entrypoints=websecure
      - traefik.http.routers.simulation-redir.tls.certresolver=letsencrypt
      - traefik.http.routers.simulation-redir.middlewares=simulation-slash
      - traefik.http.middlewares.simulation-slash.redirectregex.regex=^(https://[^/]+)/li?gh?t$$
      - traefik.http.middlewares.simulation-slash.redirectregex.replacement=$${1}/light/
networks:
  proxy:
    external: true
# Lancer :  docker compose -f simulation.yml up -d   (n'affecte pas les autres conteneurs)
